# MoneyHub configuration. Copy to moneyhub.local.yaml for private overrides (git-ignored).
output_dir: out

llm:
  # Each task tries its providers in order and falls through on error/unavailability.
  # "builtin" is an offline deterministic fallback that always works.
  tasks:
    content: [claude_cli, anthropic, gemini, groq, openrouter, ollama, builtin]
    listing: [groq, gemini, claude_cli, anthropic, openrouter, ollama, builtin]
    research: [claude_cli, anthropic, gemini, groq, openrouter, ollama, builtin]
    motion: [groq, gemini, claude_cli, anthropic, openrouter, ollama, builtin]
    art: [claude_cli, anthropic, gemini, groq, openrouter, ollama]   # who draws SVG art for --art-provider claude_svg
  providers:
    claude_cli:            # `claude -p` (Claude Code headless). Personal use / your own pipeline.
      command: claude
      model: null
      timeout: 600
    anthropic:             # Anthropic API (pay per token). Needs ANTHROPIC_API_KEY.
      model: claude-opus-5-5
      api_key_env: ANTHROPIC_API_KEY
      max_tokens: 16000
    gemini:                # Google AI Studio free tier (OpenAI-compatible endpoint).
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      model: gemini-2.5-flash
      api_key_env: GEMINI_API_KEY
    groq:                  # Groq free tier.
      base_url: https://api.groq.com/openai/v1
      model: llama-3.3-70b-versatile
      api_key_env: GROQ_API_KEY
    openrouter:            # OpenRouter (free ":free" models or paid).
      base_url: https://openrouter.ai/api/v1
      model: meta-llama/llama-3.3-70b-instruct:free
      api_key_env: OPENROUTER_API_KEY
    ollama:                # Local models. Needs `ollama serve`.
      base_url: http://localhost:11434/v1
      model: llama3.1
      api_key_env: null

render:
  # PDF renderers tried in order: weasyprint (default, no browser), chromium (Playwright).
  pdf: [weasyprint, chromium]
  # Optional AI image providers for art backgrounds (off by default): huggingface (HF_TOKEN), together (TOGETHER_API_KEY),
  # openai (OPENAI_API_KEY), local_http (MONEYHUB_ART_URL). Use with product option ai_art=1. Check each provider's terms before selling output.
  art: []
  # Short MP4 pin + Etsy listing video (needs ffmpeg or `pip install imageio-ffmpeg`).
  videos: true
  # workers: 4        # parallel PDF renders
  # chromium_path: /Applications/Chromium.app/Contents/MacOS/Chromium
  # Video engines tried in order: pillow (built in), remotion (React; `moneyhub engines install remotion`),
  # manim (`moneyhub engines install manim`). Remotion needs a licence if your company has 4+ people.
  motion: [pillow]
  # remotion_browser: /path/to/chrome-headless-shell   # optional; Remotion downloads its own if unset
  # manim_command: /path/to/manim

# Optional third-party craft tools (pdfcraft, gridcraft, vectorcraft ... installed by scripts/install_craft_tools.sh).
# Everything is OFF by default, so MoneyHub behaves exactly as before. When on, a tool is only a second opinion: a missing,
# slow or failing tool is skipped and never fails a product. Change these in Settings or with `moneyhub tools --enable pdfcraft`.
craft:
  enabled: false            # master switch
  verify_after_make: false  # add a "Second opinion" line to every new product's quality checks
  timeout: 90               # seconds per tool call
  outputs:                  # extra deliverable files built with the tools (need the master switch and the tool)
    vectors: false          # AI, EPS, PDF and layered PSD copies of poster designs (vectorcraft)
    sheets: false           # CSV and HTML copies of spreadsheets (gridcraft)
    pdfs: false             # title and author metadata on product PDFs (pdfcraft)
    after_make: false       # build the switched-on kinds for every new product; otherwise: moneyhub export craft <id>
  tools:
    vectorcraft: false
    pdfcraft: false
    gridcraft: false
    photocraft: false
    wordcraft: false
    deckcraft: false
    soundcraft: false
    cadcraft: false

# Printed on the 'Start Here' page of every download (all optional).
shop:
  name: ""
  email: ""
  url: ""

defaults:
  page_sizes: [letter, a4]
  marketplaces: [etsy, gumroad, payhip, kofi]
