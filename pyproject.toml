[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moneyhub"
version = "0.1.0"
description = "Local creator studio that generates sellable digital products (planners, trackers, worksheets, journals) plus listing kits for Etsy, Gumroad, Payhip, Ko-fi and Pinterest."
requires-python = ">=3.10"
dependencies = [
  "weasyprint>=62",
  "xlsxwriter>=3.2",
  "openpyxl>=3.1",
  "pillow>=10",
  "numpy>=1.26",
  "pyspellchecker>=0.8",
  "pypdf>=4",
  "pypdfium2>=4",
  "jinja2>=3.1",
  "pydantic>=2.6",
  "pyyaml>=6",
  "httpx>=0.27",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
chromium = ["playwright>=1.40"]
video = ["imageio-ffmpeg>=0.5"]
dev = ["pytest>=8"]

[project.scripts]
moneyhub = "moneyhub.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moneyhub = ["web/templates/*", "web/static/*", "web/static/media/*", "web/static/media/samples/*", "listing/guides/*.md", "render/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
