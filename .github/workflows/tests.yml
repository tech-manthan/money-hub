name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 ffmpeg
      - name: Install
        run: pip install -e ".[dev,video]"
      - name: Test
        run: MONEYHUB_OUT=$RUNNER_TEMP/out pytest -q
