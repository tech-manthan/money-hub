<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoneyHub</title><link rel="stylesheet" href="/static/app.css"></head>
<body>
<header class="top"><div class="in"><b>MoneyHub</b>
<nav>{% for href, label in [('/', 'Home'), ('/make', 'Make a product'), ('/products', 'My products'), ('/ideas', 'Ideas'), ('/docs', 'How to use'), ('/report', 'Sales &amp; learning'), ('/settings', 'Settings')] %}<a href="{{ href }}" class="{{ 'on' if request.url.path == href }}">{{ label|safe }}</a>{% endfor %}</nav></div></header>
<main>{% block main %}{% endblock %}</main>
<script src="/static/app.js"></script>
</body></html>
